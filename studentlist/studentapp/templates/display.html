{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    
</head>

<body>

    <h1>Student List</h1>

    {% for i in students %}

        <div class="student">

            <p>Name: {{ i.name }}</p>
            <p>Age: {{ i.age }}</p>
            <p>Course: {{ i.course }}</p>

            <a href="{% url 'update_student' i.id %}">Update</a>
            <a href="{% url 'delete_student' i.id %}">Delete</a>

        </div>

    {% endfor %}

</body>
</html>
